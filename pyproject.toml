[project]
name = "ctxopt"
version = "0.2.0"
description = "A lightweight CLI for taming LLM context windows: sandbox noisy tool output, summarize long conversations, and route prompts to the right model tier."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ctxopt contributors" }]
keywords = ["llm", "context-window", "cli", "token-optimization", "ai-agents", "prompt-routing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ctxopt = "ctxopt.cli:main"

[project.urls]
Homepage = "https://github.com/feralxr/ctxopt"
Issues = "https://github.com/feralxr/ctxopt/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
